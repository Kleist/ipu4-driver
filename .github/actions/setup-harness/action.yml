name: Setup IPU4 harness
description: |
  Apt prerequisites shared by every CI job (build-and-kunit and
  vm-smoke). Centralises the package list so the workflows do not
  drift.

  The caller must run actions/checkout *before* this action — local
  composite actions cannot load themselves until the repo is on disk.

inputs:
  extra-packages:
    description: Space-separated apt packages to install on top of the base list.
    required: false
    default: ""
  install-pip:
    description: If "true", pip3-install pytest + pytest-cov for the Python tests.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install apt prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libelf-dev libssl-dev kmod \
          python3 python3-pip qemu-system-x86 lcov \
          ${{ inputs.extra-packages }}

    - name: Install pip prerequisites
      if: ${{ inputs.install-pip == 'true' }}
      shell: bash
      run: pip3 install --user pytest pytest-cov
