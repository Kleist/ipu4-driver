name: bump-kernel-pins
on:
  schedule:
    # Mondays 05:30 UTC. 30 minutes ahead of the rebase cron so the
    # two don't pile onto the runner queue at the same minute.
    - cron: "30 5 * * 1"
  workflow_dispatch:

# One PR per kernel track. Tracks are discovered from
# .github/kernel-pins/<key>.json — a `pins` setup job globs that
# directory and emits the keys list, which the `bump` matrix then
# fans across. Adding a track is a one-file PR (drop a new
# <key>.json under .github/kernel-pins/); no edit here needed.
#
# Each leg resolves the latest stable point release for its track,
# rewrites only its own kernel-pins/<key>.json, and opens an
# independent PR against its own bot branch. Splitting the tracks
# means a single track's bump can land while the others wait on
# review or red CI, instead of a combined PR being held up by any
# one side. One file per track also means parallel bot PRs touching
# different tracks never conflict on each other on rebase.
#
# peter-evans/create-pull-request only opens a PR if the rewrite
# actually changed something, so an unchanged week is a free no-op.
#
# Caveat: PRs opened with the default GITHUB_TOKEN do NOT trigger
# downstream workflows (GitHub's anti-loop guard). To make the bump
# PR's ci.yml matrix fire automatically, set a BUMP_PAT repo secret
# (fine-grained PAT on this repo only, with Contents + Pull requests
# + Workflows write); the step below picks it up. With BUMP_PAT
# unset, peter-evans falls back to GITHUB_TOKEN and the bump PR has
# to be close-and-reopened by hand to wake CI.

permissions:
  contents: write
  pull-requests: write

jobs:
  pins:
    name: enumerate kernel tracks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      keys: ${{ steps.read.outputs.keys }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/kernel-pins/
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          set -e
          KEYS=$(
            for f in .github/kernel-pins/*.json; do
              basename "$f" .json
            done | jq -Rcs 'split("\n") | map(select(. != ""))'
          )
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"

  bump:
    name: bump (${{ matrix.key }})
    needs: pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJSON(needs.pins.outputs.keys) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve and rewrite ${{ matrix.key }} pin
        id: rewrite
        run: |
          ./tools/bump-kernel-pins.sh --key '${{ matrix.key }}' | tee /tmp/bump.summary
          new_ref="$(jq -r '.ref' .github/kernel-pins/${{ matrix.key }}.json)"
          echo "new_ref=$new_ref" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            cat /tmp/bump.summary
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open / refresh PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          # BUMP_PAT (fine-grained PAT, Contents+PRs+Workflows write
          # on this repo) makes the bump PR auto-trigger ci.yml /
          # vm-smoke. Falls back to GITHUB_TOKEN if the secret is not
          # configured — the PR still opens, just doesn't fire CI.
          token: ${{ secrets.BUMP_PAT || github.token }}
          branch: bot/bump-kernel-pins-${{ matrix.key }}
          base: main
          title: "ci: bump kernel ${{ matrix.key }} pin to ${{ steps.rewrite.outputs.new_ref }}"
          commit-message: "ci: bump kernel ${{ matrix.key }} pin to ${{ steps.rewrite.outputs.new_ref }}"
          delete-branch: true
          body: |
            Auto-generated weekly bump of the `${{ matrix.key }}`
            kernel CI pin in `.github/kernel-pins/${{ matrix.key }}.json`
            (one file per track; ci.yml, vm-smoke.yml, and
            vm-smoke-weekly.yml all read those files at workflow
            start).

            ```
            ${{ steps.rewrite.outputs.summary }}
            ```

            If the checks below are empty / stale, the BUMP_PAT
            secret isn't configured (or this PR was opened by a
            previous run before BUMP_PAT was set). Close and reopen
            this PR to wake CI manually, or wire BUMP_PAT — see
            `bump-kernel-pins.yml`.
