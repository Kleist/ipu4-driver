name: bump-kernel-pins
on:
  schedule:
    # Mondays 06:00 UTC, same slot as the rebase cron.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Resolves the latest stable point release for each of the 6.12 and
# 6.18 tracks, then opens a PR rewriting the matching
# `# bump-pin:<key>` lines in .github/workflows/ci.yml.
# peter-evans/create-pull-request only opens a PR if the rewrite
# actually changed something, so an unchanged week is a free no-op.
#
# Caveat: PRs opened with the default GITHUB_TOKEN do NOT trigger
# downstream workflows (GitHub's anti-loop guard). To make the bump
# PR's ci.yml matrix fire automatically, set a BUMP_PAT repo secret
# (fine-grained PAT on this repo only, with Contents + Pull requests
# + Workflows write); the step below picks it up. With BUMP_PAT
# unset, peter-evans falls back to GITHUB_TOKEN and the bump PR has
# to be close-and-reopened by hand to wake CI.

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve and rewrite pins
        id: rewrite
        run: |
          ./tools/bump-kernel-pins.sh | tee /tmp/bump.summary
          {
            echo "summary<<EOF"
            cat /tmp/bump.summary
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open / refresh PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          # BUMP_PAT (fine-grained PAT, Contents+PRs+Workflows write
          # on this repo) makes the bump PR auto-trigger ci.yml /
          # vm-smoke. Falls back to GITHUB_TOKEN if the secret is not
          # configured — the PR still opens, just doesn't fire CI.
          token: ${{ secrets.BUMP_PAT || github.token }}
          branch: bot/bump-kernel-pins
          base: main
          title: "ci: bump kernel pins"
          commit-message: "ci: bump kernel pins"
          delete-branch: true
          body: |
            Auto-generated weekly bump of `.github/workflows/ci.yml`'s
            kernel CI pins.

            ```
            ${{ steps.rewrite.outputs.summary }}
            ```

            If the checks below are empty / stale, the BUMP_PAT
            secret isn't configured (or this PR was opened by a
            previous run before BUMP_PAT was set). Close and reopen
            this PR to wake CI manually, or wire BUMP_PAT — see
            `bump-kernel-pins.yml`.
