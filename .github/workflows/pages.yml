name: pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  # pages-preview.yml dispatches this on the default branch after it
  # updates the pages-previews branch, so the deploy (and the
  # github-pages environment's branch protection) stays on main.
  workflow_run:
    # vm-ipu6: refresh the "IPU4 port" ladder section after every run.
    workflows: ["vm-smoke", "vm-ipu6"]
    types: [completed]
  schedule:
    # Daily refresh at 06:30 UTC. After upstream-watch (04:00 Mon)
    # and after the Monday rebase (06:00 Mon) so the dashboard picks
    # up their conclusions on the same refresh and the three crons
    # don't pile onto the runner queue at the same minute.
    - cron: '30 6 * * *'

# Standard pattern for deploy-pages: never run two deploys at once,
# but don't cancel in-flight ones (we want every refresh to land).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write       # deploy
  id-token: write    # OIDC for actions/deploy-pages
  actions: read      # gh run download for vm-smoke / vm-ipu6 artifacts
  pull-requests: read  # previews.sh merge: skip closed PRs

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build dashboard
        uses: ./.github/actions/build-dashboard
        with:
          out-dir: site

      - name: Merge PR previews
        # pages-preview.yml parks each open PR's rendered site on the
        # pages-previews branch; publish them under /pr-preview/pr-<N>/.
        # deploy-pages replaces the whole site, so they have to ride
        # along with every production deploy.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/dashboard/previews.sh merge site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
