name: main
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Milestones landed so far: M0 (in-tree migration scaffolding) and M1 (KUnit
# sources). The QEMU device model, rootfs, e2e streaming, and coverage
# report jobs are staged in tools/ but not yet wired for a green run; they
# are added back here as the corresponding milestones land (see STATUS.md).

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev \
            python3 python3-pip qemu-system-x86 lcov
          pip3 install --user pytest pytest-cov

      - name: Python unit tests + coverage
        run: ./tools/tests/pytest.sh

      - name: Bootstrap harness
        run: ./tools/bootstrap.sh

      - name: Build driver
        run: ./tools/build.sh

      - name: KUnit
        run: ./tools/tests/kunit.sh

      - name: MMIO trace coverage report
        # Always run so each push to main/master ships the current
        # silicon-vs-QEMU divergence report as an artifact. Exit code
        # is intentionally swallowed: divergence is expected today and
        # is what the report is for.
        if: always()
        run: ./tools/tests/compare-mmio.sh || true

      - name: Upload MMIO trace coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmio-trace-coverage
          path: tools/tests/out/compare-mmio/
          if-no-files-found: ignore
