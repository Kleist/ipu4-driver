name: main
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Thin caller: same body as pr.yml, just a different trigger. Both
# delegate to build-and-kunit.yml. The wider kernel matrix lands in
# the follow-on ci.yml.

jobs:
  build-and-kunit:
    uses: ./.github/workflows/build-and-kunit.yml
    with:
      linux-url:    https://github.com/torvalds/linux.git
      linux-tag:    v6.12
      display-name: "6.12"
