name: build-and-kunit (reusable)

on:
  workflow_call:
    inputs:
      linux-url:
        description: Git URL of the Linux tree to clone.
        required: true
        type: string
      linux-ref:
        description: Tag or branch to clone. Forwarded to bootstrap.sh as IPU4_LINUX_TAG.
        required: true
        type: string
      display-name:
        description: Short human label used in step output (e.g. "6.12").
        required: true
        type: string

jobs:
  build-and-kunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup harness (apt)
        uses: ./.github/actions/setup-harness

      - name: Bootstrap harness (linux=${{ inputs.linux-ref }})
        run: ./tools/bootstrap.sh
        env:
          IPU4_LINUX_URL: ${{ inputs.linux-url }}
          IPU4_LINUX_TAG: ${{ inputs.linux-ref }}

      - name: Build driver
        run: ./tools/build.sh

      - name: Run KUnit
        run: ./tools/tests/kunit.sh

      # Python trace-tool tests don't depend on the kernel ref and run
      # once in a dedicated `pytest` job from ci.yml — not here, where
      # they would re-run on every matrix leg. MMIO trace coverage is
      # produced by the vm-smoke workflow, which has the full
      # QEMU+kernel build chain. Running compare-mmio.sh here would
      # just fail for lack of a qemu.trace — the silicon-only fallback
      # was removed deliberately so the pipeline must emit a real diff
      # or error loudly.
