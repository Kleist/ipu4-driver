name: build-and-kunit (reusable)

on:
  workflow_call:
    inputs:
      linux-url:
        description: Git URL of the Linux tree to clone.
        required: true
        type: string
      linux-tag:
        description: |
          Tag or branch to clone. The sentinel "__latest_release__"
          resolves to the highest vN.M(.P) release tag advertised by
          the remote (rc tags excluded).
        required: true
        type: string
      display-name:
        description: Short human label used in step output (e.g. "6.12", "master").
        required: true
        type: string

jobs:
  build-and-kunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup harness (apt + pip)
        uses: ./.github/actions/setup-harness
        with:
          install-pip: "true"

      - name: Resolve kernel tag (${{ inputs.display-name }})
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.linux-tag }}"
          if [[ "$tag" == "__latest_release__" ]]; then
            tag="$(git ls-remote --tags --refs --sort=-v:refname \
                    "${{ inputs.linux-url }}" 'v[0-9]*' \
                  | sed -E 's@^.*refs/tags/@@' \
                  | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' \
                  | head -n1)"
            if [[ -z "$tag" ]]; then
              echo "::error::Could not resolve __latest_release__ from ${{ inputs.linux-url }}"
              exit 1
            fi
            echo "Resolved __latest_release__ -> $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Python unit tests + coverage
        run: ./tools/tests/pytest.sh

      - name: Bootstrap harness (linux=${{ steps.resolve.outputs.tag }})
        run: ./tools/bootstrap.sh
        env:
          IPU4_LINUX_URL: ${{ inputs.linux-url }}
          IPU4_LINUX_TAG: ${{ steps.resolve.outputs.tag }}

      - name: Build driver
        run: ./tools/build.sh

      - name: Run KUnit
        run: ./tools/tests/kunit.sh

      # MMIO trace coverage is produced by the vm-smoke workflow,
      # which has the full QEMU+kernel build chain. Running
      # compare-mmio.sh here would just fail for lack of a qemu.trace
      # — the silicon-only fallback was removed deliberately so the
      # pipeline must emit a real diff or error loudly.
