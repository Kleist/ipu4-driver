name: rebase
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Weekly drift detector. Re-runs the same build + KUnit + full-VM
# tiers as per-PR CI, but pointed at the moving linux-6.12.y branch
# tip instead of the pinned v6.12 tag, so a new stable point release
# gets exercised before the bumper proposes the pin move. Both legs
# go via the reusable workflows that PR CI already calls.
#
# cache-linux: false on the vm-smoke leg so we don't restore a stale
# linux-6.12.y snapshot from a previous week's run.

jobs:
  build-and-kunit:
    uses: ./.github/workflows/build-and-kunit.yml
    with:
      linux-url:    https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      linux-ref:    linux-6.12.y
      display-name: "6.12-tip"

  vm-smoke:
    uses: ./.github/workflows/vm-smoke-reusable.yml
    with:
      linux-url:    https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      linux-ref:    linux-6.12.y
      display-name: "6.12-tip"
      cache-linux:  false
