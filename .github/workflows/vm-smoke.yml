name: vm-smoke

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# 6.12-only PR/push signal. The 6.18 leg runs weekly via
# vm-smoke-weekly.yml. The 6.12 ref is kept in sync with ci.yml's
# 6.12 pin via the bump-pin comment below — the weekly bumper
# rewrites both files.

jobs:
  vm-smoke:
    uses: ./.github/workflows/vm-smoke-reusable.yml
    with:
      linux-url:    https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      linux-ref:    v6.12.83  # bump-pin:6.12
      display-name: "6.12"
