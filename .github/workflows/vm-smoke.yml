name: vm-smoke

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# 6.12-only PR/push signal. The 6.18 and 7.0 legs run weekly via
# vm-smoke-weekly.yml. All three legs read the kernel ref from
# .github/kernel-pins.json (the same source ci.yml uses), so a pin
# bump only has to touch one file.

jobs:
  pins:
    name: load kernel pins
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      url: ${{ steps.read.outputs.url }}
      ref: ${{ steps.read.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/kernel-pins.json
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          set -e
          {
            echo "url=$(jq -r '."linux-url"' .github/kernel-pins.json)"
            echo "ref=$(jq -r '.tracks["6.12"]' .github/kernel-pins.json)"
          } >> "$GITHUB_OUTPUT"

  vm-smoke:
    needs: pins
    uses: ./.github/workflows/vm-smoke-reusable.yml
    with:
      linux-url:    ${{ needs.pins.outputs.url }}
      linux-ref:    ${{ needs.pins.outputs.ref }}
      display-name: "6.12"
