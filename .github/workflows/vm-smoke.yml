name: vm-smoke
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'qemu-kunit-setup'

# Runs the full boot pipeline (bootstrap → build QEMU → build kernel →
# build initramfs → boot VM) and asserts the emulated IPU4 device
# enumerates (M2) and the driver's probe path reaches at least
# `probe:fw_valid` (M4).
#
# Cold: ~12 min on the free runner. Warm (both caches hit): ~2 min —
# the QEMU source is re-cloned but ninja detects nothing changed;
# the kernel source is re-cloned and bootstrap re-seeds driver sources
# with cmp-before-cp so mtimes survive and make rebuilds nothing.

jobs:
  vm-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev \
            meson python3-venv \
            busybox-static qemu-system-x86 \
            cpio gzip lcov

      # Cache keys are hashed over the inputs that can change the
      # corresponding build output. On cache hit, bootstrap re-clones
      # the source trees (cheap; cmp-before-cp preserves mtimes) and
      # the ninja / make invocations are near no-ops.

      # restore-keys gives us partial-cache-hit behaviour: even when
      # the exact-match key changes (every PR touches at least one
      # driver .c / build script / patch file), actions/cache picks
      # the most recent entry starting with the prefix and restores
      # the whole tree. Combined with bootstrap.sh's cmp-before-cp,
      # unchanged files keep their mtimes and kbuild / ninja only
      # rebuild the objects whose inputs actually changed.

      - name: Cache forked QEMU build
        uses: actions/cache@v4
        with:
          path: tools/qemu
          key: qemu-${{ hashFiles('tools/qemu-patches/**/*', 'tools/bootstrap.sh', 'tools/build-qemu.sh') }}
          restore-keys: |
            qemu-

      - name: Cache forked Linux build
        uses: actions/cache@v4
        with:
          path: tools/linux
          key: linux-${{ hashFiles('kernel/ipu4/**/*', 'tools/linux-patches/**/*', 'tools/bootstrap.sh', 'tools/build.sh', 'tools/build-kernel.sh') }}
          restore-keys: |
            linux-

      - name: Bootstrap harness
        run: ./tools/bootstrap.sh

      - name: Build QEMU (ipu4 device)
        run: ./tools/build-qemu.sh

      - name: Build kernel + driver
        run: ./tools/build-kernel.sh

      - name: Build initramfs
        run: ./tools/rootfs/build.sh

      - name: Boot VM, verify IPU4 device enumerates
        run: ./tools/tests/vm-smoke.sh
        env:
          IPU4_ACCEL: tcg

      - name: Boot VM, verify driver probe progresses past fw_valid
        run: ./tools/tests/probe-smoke.sh
        env:
          IPU4_ACCEL: tcg

      - name: Boot VM, walk v4l2 capture API
        run: ./tools/tests/streamon-smoke.sh
        env:
          IPU4_ACCEL: tcg

      - name: Capture QEMU MMIO trace
        # Strict: a capture regression blocks merge. This is the QEMU
        # side that makes the coverage report's value-mismatch
        # classification meaningful (without it, only the
        # silicon-only unimplemented list can fire).
        run: ./tools/tests/mmiotrace.sh
        env:
          IPU4_ACCEL: tcg

      - name: Full MMIO trace coverage report (silicon vs QEMU)
        # Always run so the diff is published even when the capture
        # above failed. compare-mmio.sh distinguishes harness faults
        # (missing inputs / empty outputs → exit 1, blocks merge)
        # from divergence-only (expected until the model catches up
        # → exit 0, report still produced as the artifact).
        if: always()
        run: ./tools/tests/compare-mmio.sh

      - name: Upload MMIO trace coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmio-trace-coverage-vm-smoke-${{ github.run_id }}
          path: |
            tools/tests/out/compare-mmio/
            tools/tests/out/mmiotrace/
          if-no-files-found: ignore

      - name: Build coverage report from streamon-smoke gcov harvest
        run: ./tools/coverage/collect.sh

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ github.run_id }}
          path: tools/coverage/html
          if-no-files-found: warn

      - name: Upload serial logs + artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-smoke-failure-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            tools/tests/out/*.serial
            tools/tests/out/gcov.tar
            tools/rootfs/out/rootfs.cpio.gz
            tools/linux/arch/x86/boot/bzImage
            tools/linux/.config
