name: vm-smoke-weekly

on:
  schedule:
    # Sundays 07:00 UTC. The Monday 06:00 bumper cron lands a fresh
    # weekly result before considering whether to bump pins.
    - cron: "0 7 * * 0"
  workflow_dispatch:

# 6.18 vm-smoke runs once a week, separately from the per-PR 6.12
# vm-smoke (in vm-smoke.yml). The 6.18 ref is kept in sync with
# ci.yml's 6.18 pin via the bump-pin comment below — the weekly
# bumper rewrites both files.

jobs:
  vm-smoke:
    uses: ./.github/workflows/vm-smoke-reusable.yml
    with:
      linux-url:    https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      linux-ref:    v6.18.24  # bump-pin:6.18
      display-name: "6.18"
