name: vm-smoke-weekly

on:
  schedule:
    # Sundays 07:00 UTC. The Monday 05:30 bumper cron lands a fresh
    # weekly result before considering whether to bump pins.
    - cron: "0 7 * * 0"
  workflow_dispatch:

# Weekly vm-smoke for kernels not on the per-PR canary track. The 6.12
# leg runs on every PR via vm-smoke.yml; every other track in
# .github/kernel-pins/ (today: 6.18 + 7.0) runs here. The `pins`
# setup job globs that directory and emits a matrix-shaped output
# covering all non-6.12 tracks; vm-smoke then fans across with
# fail-fast: false so one bad kernel doesn't mask the other.

jobs:
  pins:
    name: load kernel pins
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/kernel-pins/
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          set -e
          INCLUDE=$(
            for f in .github/kernel-pins/*.json; do
              key="$(basename "$f" .json)"
              [[ "$key" == "6.12" ]] && continue
              jq --arg name "$key" \
                 '{name: $name, ref: .ref, url: .url}' "$f"
            done | jq -sc 'sort_by(.name)'
          )
          MATRIX=$(jq -nc --argjson inc "$INCLUDE" '{include: $inc}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  vm-smoke:
    needs: pins
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pins.outputs.matrix) }}
    uses: ./.github/workflows/vm-smoke-reusable.yml
    with:
      linux-url:    ${{ matrix.url }}
      linux-ref:    ${{ matrix.ref }}
      display-name: ${{ matrix.name }}
