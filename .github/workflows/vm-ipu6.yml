name: vm-ipu6

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Test ladder for the IPU4 drivers: the upstream ipu6 driver with the
# IPU4 series (patches/ipu6-ipu4/) and the out-of-tree kernel/ipu4/
# module. Plan and test table: tools/notes/ipu6-ipu4-plan.md.
#
# tools/tests/ipu6/ladder.sh runs every known test and prints a
# PASS / FAIL / SKIP / NOT-IMPLEMENTED table (also in the job summary).
# Only the tests listed in the leg's
# tools/tests/ipu6/enabled-tests.<driver>.<variant> fail the job, so tests
# that are not switched on yet stay visible without blocking merges.
#
# Six legs, driver / QEMU model variant (table in ladder.sh): each IPU
# under its unmodified baseline driver, ipu4-out-of-tree / ipu4
# (kernel/ipu4/ on v7.3-rc4), ipu4p / ipu4p (Ruslan's tree, tools/ipu6/pin)
# and ipu6 / ipu6 (mainline, tools/ipu6/pin.upstream), and each IPU under
# the upstreamable ipu4-patches (Ruslan's tree + patches/ipu6-ipu4/).
#
# Runs alongside ci.yml / vm-smoke.yml (fork flow, kernel/ipu4/ seeded
# in-tree); nothing here touches tools/linux/. QEMU comes from
# `tools/bootstrap.sh --qemu-only` and shares its build cache with
# vm-smoke-reusable.yml (same key). The harness-only virt-sensor module
# (tools/virt-sensor/) is rebuilt by the module-load test on every run (a
# few seconds, so it is not cached).

jobs:
  # Skip the ladder on PRs that don't touch its inputs
  # (tools/ci/changes.sh); push / workflow_dispatch always run it.
  changes:
    uses: ./.github/workflows/changes.yml

  ladder:
    # Keep the check name short ("ladder (ipu4-patches / ipu4)"); by
    # default it would list every matrix.include field.
    name: ladder (${{ matrix.driver }} / ${{ matrix.variant }})
    needs: changes
    runs-on: ubuntu-24.04
    # Gated per step rather than with a job-level `if:`: a skipped
    # matrix job reports one check with the unexpanded name, so
    # "ladder (ipu4-patches / ipu4)" etc. would never report and a
    # required check on them would hang. Every step below carries
    # `env.SELECTED == 'true'`.
    env:
      SELECTED: ${{ needs.changes.outputs.ipu6 }}
    strategy:
      fail-fast: false
      matrix:
        # linux-dir / pin mirror the driver table in
        # tools/tests/ipu6/ladder.sh; they only key the tree cache, named
        # after the tree's directory (the ipu4-patches legs share it).
        include:
          - driver: ipu4-out-of-tree
            variant: ipu4
            linux-dir: tools/linux-ipu4-oot
            pin: tools/out-of-tree/pin
            cache: linux-ipu4-oot
          - driver: ipu4p
            variant: ipu4p
            linux-dir: tools/linux-ipu6-ruslan
            pin: tools/ipu6/pin
            cache: linux-ipu6-ruslan
          - driver: ipu6
            variant: ipu6
            linux-dir: tools/linux-ipu6-upstream
            pin: tools/ipu6/pin.upstream
            cache: linux-ipu6-upstream
          - driver: ipu4-patches
            variant: ipu4
            linux-dir: tools/linux-ipu6
            pin: tools/ipu6/pin
            cache: linux-ipu6
          - driver: ipu4-patches
            variant: ipu4p
            linux-dir: tools/linux-ipu6
            pin: tools/ipu6/pin
            cache: linux-ipu6
          - driver: ipu4-patches
            variant: ipu6
            linux-dir: tools/linux-ipu6
            pin: tools/ipu6/pin
            cache: linux-ipu6
    # Cold (no cache): QEMU build + full guest-kernel build dominate,
    # see the PR 4 learnings in the plan for measured times. Warm runs
    # rebuild only what the series touches.
    timeout-minutes: 45
    steps:
      - name: No ladder inputs changed; skipping
        if: env.SELECTED != 'true'
        run: echo "tools/ci/changes.sh selected no ipu6-flavor change; ladder skipped."

      - uses: actions/checkout@v4
        if: env.SELECTED == 'true'
        with:
          fetch-depth: 1

      - name: Setup harness (apt + QEMU build deps)
        if: env.SELECTED == 'true'
        uses: ./.github/actions/setup-harness
        with:
          extra-packages: >-
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev
            meson python3-venv busybox-static cpio gzip

      # Same key as vm-smoke-reusable.yml, so either workflow's saved
      # build is reused by the other.
      - name: Cache forked QEMU build
        if: env.SELECTED == 'true'
        uses: actions/cache@v4
        with:
          path: tools/qemu
          key: qemu-${{ hashFiles('tools/qemu-patches/**/*', 'tools/bootstrap.sh', 'tools/build-qemu.sh') }}
          restore-keys: |
            qemu-

      - name: Bootstrap QEMU (no fork Linux tree)
        if: env.SELECTED == 'true'
        run: ./tools/bootstrap.sh --qemu-only

      - name: Build QEMU (ipu4 device)
        if: env.SELECTED == 'true'
        run: ./tools/build-qemu.sh

      # The pinned tree is ~300 MB of git objects plus the guest-kernel
      # build output. Keyed by the variant's pin so a pin bump starts
      # clean (the restore prefix includes it); bootstrap resets the
      # restored tree to the pin and re-applies the series, keeping
      # mtimes of untouched files so make only rebuilds what changed.
      - name: Cache Linux tree
        if: env.SELECTED == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ matrix.linux-dir }}
          key: ${{ matrix.cache }}-${{ hashFiles(matrix.pin) }}-${{ hashFiles('patches/ipu6-ipu4/**', 'tools/ipu6/*.sh', 'tools/out-of-tree/*.sh', 'tools/build-kernel.sh', 'tools/vm-kconfig.sh') }}
          restore-keys: |
            ${{ matrix.cache }}-${{ hashFiles(matrix.pin) }}-

      - name: Run ipu6 ladder
        if: env.SELECTED == 'true'
        run: ./tools/tests/ipu6/ladder.sh
        env:
          IPU4_ACCEL: tcg
          IPU4_DRIVER: ${{ matrix.driver }}
          IPU4_VARIANT: ${{ matrix.variant }}

      # Small dedicated artifact read by pages.yml (dashboard "IPU4 port"
      # section), one per leg.
      - name: Upload ladder results
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ipu6-ladder-results-${{ matrix.driver }}-${{ matrix.variant }}
          path: tools/tests/out/ipu6-ladder/results.json
          if-no-files-found: ignore

      - name: Upload ladder logs
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vm-ipu6-ladder-${{ matrix.driver }}-${{ matrix.variant }}-${{ github.run_id }}
          # By pattern, so a new test's logs (tools/tests/out/ipu6-*)
          # need no change here.
          path: |
            tools/tests/out/ipu6-*
            tools/tests/out/vm-smoke-*.serial
            ${{ matrix.linux-dir }}/.config
          if-no-files-found: ignore
