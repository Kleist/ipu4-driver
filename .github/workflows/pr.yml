name: pr
on:
  pull_request:

# Thin caller: every kernel matrix leg lives in build-and-kunit.yml.
# This file pins the PR check to v6.12 (current tested kernel). The
# wider matrix (6.18 / latest release / master) lands in a follow-on
# ci.yml; until then PR signal is the same single-kernel check it has
# always been.

jobs:
  build-and-kunit:
    uses: ./.github/workflows/build-and-kunit.yml
    with:
      linux-url:    https://github.com/torvalds/linux.git
      linux-tag:    v6.12
      display-name: "6.12"
