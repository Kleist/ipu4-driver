name: pr
on:
  pull_request:

jobs:
  build-and-kunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev \
            python3 python3-pip qemu-system-x86 lcov
          pip3 install --user pytest pytest-cov

      - name: Python unit tests + coverage
        run: ./tools/tests/pytest.sh

      - name: Bootstrap harness
        run: ./tools/bootstrap.sh

      - name: Build driver
        run: ./tools/build.sh

      - name: Run KUnit
        run: ./tools/tests/kunit.sh

      # MMIO trace coverage is produced by the vm-smoke workflow,
      # which has the full QEMU+kernel build chain. Running
      # compare-mmio.sh here would just fail for lack of a qemu.trace
      # — the silicon-only fallback was removed deliberately so the
      # pipeline must emit a real diff or error loudly.
