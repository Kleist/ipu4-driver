name: pr
on:
  pull_request:

jobs:
  build-and-kunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev \
            python3 python3-pip qemu-system-x86 lcov
          pip3 install --user pytest pytest-cov

      - name: Python unit tests + coverage
        run: ./tools/tests/pytest.sh

      - name: Bootstrap harness
        run: ./tools/bootstrap.sh

      - name: Build driver
        run: ./tools/build.sh

      - name: Run KUnit
        run: ./tools/tests/kunit.sh

      - name: MMIO trace coverage report
        # Always run so the report is published every PR. The diff
        # between data/trace.txt and the (currently absent) QEMU-side
        # capture exits non-zero by design today — that *is* the
        # worklist for ipu4.c handler PRs. `|| true` keeps CI green.
        if: always()
        run: ./tools/tests/compare-mmio.sh || true

      - name: Upload MMIO trace coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmio-trace-coverage
          path: tools/tests/out/compare-mmio/
          if-no-files-found: ignore
