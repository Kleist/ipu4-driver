name: ci
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Build + kunit fan-out across the kernels we support. Each leg is
# pinned to a specific tag so per-PR CI is deterministic — kernel.org
# pushing a new point release does not silently change what a
# contributor's PR builds against.
#
# The pins themselves live in .github/kernel-pins.json (single source
# of truth, shared with vm-smoke.yml and vm-smoke-weekly.yml). The
# `pins` job below reads that file and emits a matrix-shaped output
# that build-and-kunit then fans across with `fail-fast: false` (so
# one bad kernel doesn't mask the other).
#
# Pins move via .github/workflows/bump-kernel-pins.yml, which runs
# weekly and opens one PR per track with the new value; that PR's
# checks then exercise the new kernel before the bump can land. The
# 6.18 leg is expected red until the matching compat shims land in
# kernel/ipu4/ipu4-compat.h. The 7.0 leg builds clean against the
# existing shim cascade (the 6.14+ namespace literal branch covers it).

jobs:
  # Python trace-tool tests are kernel-ref-independent, so they run
  # once here instead of on every matrix leg of build-and-kunit.
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup harness (apt + pip)
        uses: ./.github/actions/setup-harness
        with:
          install-pip: "true"
      - name: Python unit tests + coverage
        run: ./tools/tests/pytest.sh

  pins:
    name: load kernel pins
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/kernel-pins.json
          sparse-checkout-cone-mode: false
      - id: read
        name: Read .github/kernel-pins.json
        run: |
          set -e
          URL=$(jq -r '."linux-url"' .github/kernel-pins.json)
          MATRIX=$(jq -c --arg url "$URL" \
            '{include: [.tracks | to_entries[] | {name: .key, ref: .value, url: $url}]}' \
            .github/kernel-pins.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-kunit:
    name: build-and-kunit (${{ matrix.name }})
    needs: pins
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pins.outputs.matrix) }}
    uses: ./.github/workflows/build-and-kunit.yml
    with:
      linux-url:    ${{ matrix.url }}
      linux-ref:    ${{ matrix.ref }}
      display-name: ${{ matrix.name }}
