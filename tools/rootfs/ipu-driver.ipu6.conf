# shellcheck shell=sh disable=SC2034
# The IPU driver of the ipu6 flavor, as the ladder's guest inits
# (init.ipu6-*, their init.ipu6-probe.d/ snippets) and host checks
# (tools/tests/ipu6/) name it. Staged by tools/rootfs/build.sh as
# /etc/ipu-driver.conf and sourced by tools/tests/ipu6/ladder.sh.

# The sensor module loaded before the driver (tools/virt-sensor/, which
# attaches its fwnode graph to the IPU); empty when the driver has one
# built in.
IPU_SENSOR_MODULE=virt-sensor
# Modules in load order, after vb2 and the sensor; IPU_PCI_DRIVER probes
# the IPU inside its insmod.
IPU_MODULES="intel-ipu6 intel-ipu6-isys"
IPU_PCI_DRIVER=intel-ipu6
# KBUILD_MODNAME of the PCI driver: prefix of its auxiliary devices
# (intel_ipu6.isys.0) and of its dmesg lines.
IPU_MODNAME=intel_ipu6
# Prefix of the media entity and video node names.
IPU_ENTITY="Intel IPU6"
# Firmware the driver requests for the IPU4 (8086:5a88).
IPU_FW_IPU4=intel/ipu/ipu4_fw.bin
